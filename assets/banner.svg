<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glowing Pill Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Dynamic Animations -->
    <style>
      @keyframes floatPill1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(1); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .animated-pill-1 {
        animation: floatPill1 6s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-pill-2 {
        animation: floatPill2 7s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-glow {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Layer -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Background Animated Elements (Layered behind text) -->
  <g class="pulsing-glow">
    <circle cx="150" cy="60" r="100" fill="#7c3aed" filter="blur(50px)" opacity="0.15"/>
    <circle cx="750" cy="180" r="120" fill="#06b6d4" filter="blur(60px)" opacity="0.15"/>
  </g>

  <!-- Flow Lines (Background Layer) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 180 Q 250 140 450 180 T 850 150" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-line" d="M 50 60 Q 300 110 550 50 T 850 90" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Animated Dynamic Background Badges / Floating Cards -->
  <g class="animated-pill-1">
    <rect x="50" y="30" width="130" height="34" rx="17" fill="url(#pillGrad1)" stroke="#7c3aed" stroke-width="1"/>
    <text x="115" y="52" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Legacy Migration</text>
  </g>

  <g class="animated-pill-2">
    <rect x="720" y="35" width="130" height="34" rx="17" fill="url(#pillGrad2)" stroke="#06b6d4" stroke-width="1"/>
    <text x="785" y="57" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open-Source ERP</text>
  </g>

  <g class="animated-pill-1" style="animation-delay: -3s;">
    <rect x="740" y="170" width="110" height="32" rx="16" fill="url(#pillGrad1)" stroke="#a855f7" stroke-width="1"/>
    <text x="795" y="191" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SaaS Pricing</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, and Key Highlights (Rendered last to guarantee maximum clarity and visibility) -->
  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="900" height="5" fill="url(#accentGrad)"/>

  <!-- Main Title -->
  <g transform="translate(450, 110)">
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      Awesome Small Business ERP Legacy 🚀
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(450, 145)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2" text-anchor="middle">
      Curated Ecosystem of Legacy ERP Migration, SaaS Benchmarks &amp; Open-Source Alternatives
    </text>
  </g>

  <!-- Bottom Stats / Feature Pills -->
  <g transform="translate(450, 195)">
    <!-- Pill 1: SaaS Benchmarks -->
    <g transform="translate(-230, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💼 10+ SaaS Platforms</text>
    </g>
    <!-- Pill 2: Open Source Stars -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ 15+ Open-Source Repos</text>
    </g>
    <!-- Pill 3: Star Verified -->
    <g transform="translate(230, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="4" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⭐ Star Count Ranked</text>
    </g>
  </g>
</svg>
